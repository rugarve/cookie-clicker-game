<div class="game-container">
  <h1>Hola, {{ username }}!</h1>
  <p aria-live="polite">Marcador: {{ points }}</p>
  
  <app-button 
    [text]="'Genera puntos'"
    [styleClass]="'click-btn'"
    (buttonClick)="addPoint()">
  </app-button>
  
  <div *ngIf="points >= 50">
    <app-button 
      [text]="'Compra autoclickers (Cost: ' + autoClickerCost + ')'"
      [disabled]="points < autoClickerCost"
      [styleClass]="'auto-clicker-btn'"
      (buttonClick)="buyAutoClicker()">
    </app-button>
    <p>You own {{ autoClickers }} AutoClickers</p>
  </div>
  
  <app-button 
    [text]="'Salir'"
    [styleClass]="'exit-btn'"
    (buttonClick)="exitGame()">
  </app-button>
</div>
